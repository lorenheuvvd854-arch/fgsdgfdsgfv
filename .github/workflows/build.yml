name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos + brew deps
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          brew install ldid
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          make clean
          make ipa LDID="$(brew --prefix)/bin/ldid" 'F1OOBPoC_LDFLAGS=-Wl,-platform_version,ios,14.0,14.0'

      - name: Collect ipa
        run: |
          mkdir -p out
          cp -v F1OOB-PoC.ipa out/
          ls -laF out

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-PoC-ipa
          path: out/
